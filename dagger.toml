ignore = [
  "**/node_modules",
  "**/dist",
  "**/.tsbuild",
  "**/*.tsbuildinfo",
]

[modules.eslint]
source = "dagger.io/js/eslint"

[modules.eslint.settings]
packageManager = "pnpm"
baseImageAddress = "node:24-slim"
installFlags = ["--ignore-scripts"]

[modules.prettier]
source = "dagger.io/js/prettier"

[modules.prettier.settings]
packageManager = "pnpm"
baseImageAddress = "node:24-slim"
installFlags = ["--ignore-scripts"]

[modules.ci]
source = "github.com/langri-sha/dagger/ci@v1.4.0"

[modules.typescript]
source = "github.com/langri-sha/dagger/typescript@v1.2.1"

[modules.vitest]
source = "github.com/langri-sha/dagger/vitest@v1.2.1"

[modules.beachball]
source = "github.com/langri-sha/dagger/beachball@v1.2.1"
