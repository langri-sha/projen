ignore = [
  "**/node_modules",
  "**/dist",
  "**/.tsbuild",
  "**/*.tsbuildinfo",
]

[modules.eslint]
source = "dagger.io/js/eslint"

[modules.eslint.settings]
packageManager = "pnpm"
baseImageAddress = "node:24-slim"
installFlags = ["--ignore-scripts"]

[modules.prettier]
source = "dagger.io/js/prettier"

[modules.prettier.settings]
packageManager = "pnpm"
baseImageAddress = "node:24-slim"
installFlags = ["--ignore-scripts"]

