# ~~ Generated by projen. To modify, edit .projenrc.ts and run "pnpm exec projen".

ignore = [
  "**/node_modules",
  "**/dist",
  "**/*.tsbuildinfo",
  "**/.tsbuild"
]

[modules.eslint]
source = "dagger.io/js/eslint"

  [modules.eslint.settings]
  packageManager = "pnpm"
  baseImageAddress = "node:24-slim"
  installFlags = [ "--ignore-scripts" ]

[modules.prettier]
source = "dagger.io/js/prettier"

  [modules.prettier.settings]
  packageManager = "pnpm"
  baseImageAddress = "node:24-slim"
  installFlags = [ "--ignore-scripts" ]

[modules.ci]
source = "github.com/langri-sha/dagger/ci@v2.4.1"

  [modules.ci.generate]
  skip = [ "projen" ]

[modules.projen]
source = "github.com/langri-sha/dagger/projen@v2.4.1"

[modules.typescript]
source = "github.com/langri-sha/dagger/typescript@v2.4.1"

  [modules.typescript.settings]
  prepublish = true

[modules.vitest]
source = "github.com/langri-sha/dagger/vitest@v2.4.1"

  [modules.vitest.settings]
  baseImageAddress = "node:24"

[modules.beachball]
source = "github.com/langri-sha/dagger/beachball@v2.4.1"

[modules.actionlint]
source = "github.com/langri-sha/dagger/actionlint@v2.4.1"

[modules.smoke]
source = ".dagger/smoke"

  [modules.smoke.check]
  skip = [ "generate-schemas/stale" ]
