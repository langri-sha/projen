        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </g>

    <!-- The young tree rises from the dark opening. -->
    <g filter="url(#rough-soft)">
      <path
        d="M316 372c4-54 2-110 7-164 2-25 5-45 11-63"
        fill="none"
        stroke="#07101e"
        stroke-width="28"
        stroke-linecap="round"
      />
      <path
        d="M316 372c4-54 2-110 7-164 2-25 5-45 11-63"
        fill="none"
        stroke="#63f5c5"
        stroke-width="14"
        stroke-linecap="round"
      />
      <path
        d="M322 227c-48 3-83-22-94-68 49-4 87 17 103 54 6 12 3 13-9 14Z"
        fill="#c8ff3d"
        stroke="#07101e"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M334 199c8-47 40-76 88-74-1 46-30 77-76 86-13 2-15 0-12-12Z"
        fill="#63f5c5"
        stroke="#07101e"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M333 154c-21-24-20-56 0-82 25 25 27 54 9 79-4 6-6 7-9 3Z"
        fill="#c8ff3d"
        stroke="#07101e"
        stroke-width="13"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <g
