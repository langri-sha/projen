    >
      <path d="m169 381 12 4M178 411l15 6M164 451l12-2" />
      <path d="m449 374 15 4M446 408l18 8M444 458l12-3" />
      <path d="m220 390 13 4M220 475l18 6M355 474l17-4M388 391l15 5" />
      <path d="m271 290 10-5M351 288l14 4M148 330l13 6M457 329l12 5" />
      <path d="m118 421 9 7M500 407l11-3M397 504l13 5M273 514l12-4" />
    </g>
    <g fill="#07101e">
      <path d="m181 437 12-4 4 9-12 5Z" />
      <path d="m461 429 10-5 6 8-10 7Z" />
      <path d="m220 499 9-5 7 8-8 7Z" />
      <circle cx="370" cy="391" r="5" />
      <circle cx="401" cy="479" r="4" />
      <circle cx="142" cy="399" r="4" />
    </g>

    <!-- Loose packing scraps and a crooked dimension line ground the pile. -->
    <path
      d="m102 521 49-16 31 28-50 14Z"
      fill="#ecd7a4"
      stroke="#07101e"
      stroke-width="11"
      stroke-linecap="round"
      stroke-linejoin="round"
