      >
        <path d="M324 217c-22-18-44-30-68-39" />
        <path d="M339 199c20-21 39-36 59-47" />
        <path d="M336 144c0-21-1-37-4-51" />
      </g>
    </g>

    <!-- The front panel hides the base of the trunk inside the box. -->
    <g filter="url(#rough-soft)">
      <path
        d="m194 359 230-7 8 172-226 9Z"
        fill="#dfbf84"
        stroke="#07101e"
        stroke-width="16"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="m309 358 3 168"
