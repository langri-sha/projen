      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M163 155c-23-1-39 2-51 6-2 17-1 34 2 51" stroke="#4b7bff" />
      <path d="M475 158c21-2 36 1 51 5 3 18 2 35-1 53" stroke="#9b61ff" />
      <path d="M119 447c-2 18 0 33 4 46 15 3 30 4 49 1" stroke="#9b61ff" />
    </g>
    <circle cx="105" cy="268" r="7" fill="#4b7bff" />
    <circle cx="528" cy="283" r="7" fill="#9b61ff" />

    <!-- Left collapsed box, bowed and patched. -->
    <g filter="url(#rough-soft)">
      <path
        d="M83 357 197 337l31 124-120 27-29-89Z"
        fill="#d6b780"
        stroke="#07101e"
        stroke-width="15"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="m83 357 47-42 120-10-53 32Z"
        fill="#ecd7a4"
        stroke="#07101e"
        stroke-width="13"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="m108 343 36 134"
        fill="none"
        stroke="#4b7bff"
        stroke-width="17"
        stroke-linecap="round"
        opacity=".9"
      />
      <path
        d="m157 351 28 112M100 390c34 5 70 0 104-8"
        fill="none"
        stroke="#07101e"
        stroke-width="6"
        stroke-linecap="round"
