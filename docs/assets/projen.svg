      <path
        d="m427 389 92 15M426 444c30-7 59-4 87 4"
        fill="none"
        stroke="#07101e"
        stroke-width="6"
        stroke-linecap="round"
        opacity=".7"
      />
    </g>

    <!-- Side walls and dark opening of the central broken box. -->
    <g filter="url(#rough-soft)">
      <path
        d="m195 359-58-36 18 161 52 48Z"
        fill="#b99460"
        stroke="#07101e"
        stroke-width="15"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="m423 352 64-37-13 165-43 45Z"
        fill="#b58f5d"
        stroke="#07101e"
        stroke-width="15"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
