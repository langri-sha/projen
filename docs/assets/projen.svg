        d="m416 352 120 17-14 122-120-21 4-80Z"
        fill="#caa66f"
        stroke="#07101e"
        stroke-width="15"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="m416 352 51-37 112 26-43 28Z"
        fill="#e7ca91"
        stroke="#07101e"
        stroke-width="13"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="m520 341-15 143"
        fill="none"
