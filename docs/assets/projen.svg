<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 640"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Projen sprouting boxes sticker</title>
  <desc id="description">
    A rough hand-inked pile of worn cardboard project boxes with a young tree
    sprouting from an open box on a dark blueprint field.
  </desc>

  <defs>
    <path
      id="sticker-field"
      d="M320 47c29-18 60-17 82 3 40-7 79 11 94 42 37 10 63 38 64 72 30 20 41 55 29 86 26 27 27 62 8 89 19 33 8 70-18 91 4 37-18 69-50 79-12 36-44 55-78 52-27 27-65 34-96 21-31 21-69 20-96-2-33 12-69 0-87-28-38 1-67-24-72-56-34-16-48-52-36-82-27-26-26-64-4-89-17-33-8-70 17-92-6-37 16-69 48-80 9-35 40-57 72-57 21-32 56-46 87-36 20-17 42-22 64-17Z"
    />
    <clipPath id="field-clip">
      <use href="#sticker-field" />
    </clipPath>
    <filter
      id="rough-ink"
      x="-12%"
      y="-12%"
      width="124%"
      height="124%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".014 .08"
        numOctaves="2"
        seed="31"
        result="ink-noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="ink-noise"
        scale="5"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
    <filter
      id="rough-soft"
      x="-10%"
      y="-10%"
      width="120%"
      height="120%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".02 .095"
        numOctaves="2"
        seed="13"
        result="line-noise"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="line-noise"
        scale="3"
        xChannelSelector="R"
        yChannelSelector="G"
      />
    </filter>
  </defs>

  <!-- The irregular double keyline is the sticker's hand-cut edge. -->
  <use
    href="#sticker-field"
    fill="#0a1223"
    stroke="#f4f0de"
    stroke-width="18"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#rough-ink)"
  />
  <use
    href="#sticker-field"
    fill="none"
    stroke="#f4f0de"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity=".7"
    transform="translate(3 -2)"
    filter="url(#rough-ink)"
  />

  <g clip-path="url(#field-clip)">
    <!-- Faint, crooked blueprint grid behind the physical build. -->
    <g
      fill="none"
      stroke="#4b7bff"
      stroke-width="4"
      stroke-linecap="round"
      opacity=".18"
    >
      <path d="M70 176c112-6 225 4 337-2 68-4 123 1 170 5" />
      <path d="M55 265c128 5 242-6 362 1 68 4 117-3 171 0" />
      <path d="M49 355c123-4 241 5 367-1 70-4 128 4 184-2" />
      <path d="M62 450c118 5 233-4 354 2 64 4 115-2 166 3" />
      <path d="M133 104c-4 111 5 225-1 340-3 57 2 102-1 139" />
      <path d="M229 72c5 98-4 200 2 300 4 75-3 146 1 209" />
      <path d="M417 69c-5 100 5 202-1 306-4 76 2 142-2 201" />
      <path d="M511 104c4 94-5 191 2 286 3 65-2 111 1 151" />
    </g>

    <!-- A few loose registration marks keep the blueprint cue text-free. -->
    <g
